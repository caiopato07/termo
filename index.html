<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Termo Sussa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>TERMO</h1>
  <div id="auth-container" style="
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
        align-items: center;
      ">
    <h3 style="margin: 0; color: #ffffff">Login no Termo</h3>

    <input type="text" id="username" placeholder="Nome de usuário" style="
          padding: 10px;
          width: 250px;
          border-radius: 5px;
          border: 1px solid #3a3a3c;
          background: #121213;
          color: white;
        " />
    <input type="password" id="password" placeholder="Sua senha" style="
          padding: 10px;
          width: 250px;
          border-radius: 5px;
          border: 1px solid #3a3a3c;
          background: #121213;
          color: white;
        " />

    <div style="display: flex; gap: 10px">
      <button id="btnLogin" style="
            padding: 10px 20px;
            cursor: pointer;
            background-color: #3a3a3c;
            color: white;
            border: none;
            border-radius: 5px;
          ">
        Entrar
      </button>
      <button id="btnCadastro" style="
            padding: 10px 20px;
            cursor: pointer;
            background-color: #145ecc;
            color: white;
            border: none;
            border-radius: 5px;
          ">
        Criar Conta
      </button>
    </div>
    <div id="auth-message" style="
          color: #f7ee04;
          font-weight: bold;
          text-align: center;
          max-width: 250px;
        "></div>
  </div>

  <div id="user-info"
    style="display: none; align-items: center; flex-direction: column; gap: 10px; margin-bottom: 20px;">
    <div id="welcome-msg" style="font-size: 1.2rem; font-weight: bold; color: #c43e9c;"></div>

    <div style="font-size: 1rem; color: #943076;">
      Aura: <span id="user-aura" style="font-weight: bold; color: white;">0</span> |
      Hoje: <span id="daily-count" style="font-weight: bold; color: white;">0</span>/5
    </div>

    <button id="btnLogout"
      style="padding: 5px 15px; cursor: pointer; background-color: #818384; color: white; border: none; border-radius: 5px;">Sair</button>
  </div>

  <div id="ranking-container"
    style="display: none; margin-top: 40px; border-top: 1px solid #3a3a3c; padding-top: 20px; width: 100%; max-width: 350px;">
    <h3 id="topranking" style="text-align: center; color: #bcff1f; margin-top: 0;">🏆 Top 5 Aura 🏆</h3>
    <ol id="ranking-list" style="padding-left: 20px; font-size: 1.1rem; line-height: 1.8;"></ol>
  </div>

  <button id="btnLogout" style="
        display: none;
        margin-bottom: 20px;
        padding: 5px 15px;
        cursor: pointer;
      ">
    Sair
  </button>
  <div id="message"></div>
  <div id="board"></div>
  <div id="keyboard"></div>

  <script src="PALAVRAS_TERMO.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
